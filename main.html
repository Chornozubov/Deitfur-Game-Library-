<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deitfur Game Library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <a class="logo" href="#home">Deitfur</a>

    <nav class="navigation">
      <a class="nav-link" href="#home" aria-current="page">Home</a>
      <a class="nav-link" href="#games">Games</a>
      <a class="nav-link" href="#about">About</a>
      <button class="theme-button" id="themeButton" type="button" aria-label="Switch to light theme" aria-pressed="false">
        <span class="theme-icon theme-icon-sun" aria-hidden="true">☀</span>
        <span class="theme-toggle" aria-hidden="true"><span class="theme-thumb"></span></span>
        <span class="theme-icon theme-icon-moon" aria-hidden="true">☾</span>
      </button>
    </nav>
  </header>

  <main>
    <section class="welcome" id="home">
      <p class="small-title">GAME LIBRARY</p>
      <h1>Find your next game.</h1>
      <p class="welcome-text">A simple place for games we like.</p>
      <a class="button" href="#games">View games</a>
    </section>

    <section class="games-section" id="games">
      <div class="section-title">
        <h2>Games</h2>
        <p>Add your games here later</p>
      </div>

     <div class="game-list">

     </div>
    </section>

    <section class="about" id="about">
      <h2>About the project</h2>
      <p>This block is ready for your text.</p>
    </section>
  </main>

  <footer>Deitfur Game Library</footer>

  <script src="script.js"></script>
  <script src="theme.js"></script>
</body>

</html>
